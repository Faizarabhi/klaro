<div class="max-w-2xl mx-auto p-8 bg-white shadow-xl rounded-2xl mt-10">
  <h2 class="text-3xl font-bold text-gray-800 mb-2">Demande d'Aide Financière</h2>
  <p class="text-gray-600 mb-8">Remplissez le formulaire ci-dessous pour soumettre votre dossier au gestionnaire.</p>

  <div *ngIf="successMessage" class="mb-6 p-4 bg-green-100 text-green-700 rounded-lg border border-green-200">
    {{ successMessage }}
  </div>
  <div *ngIf="errorMessage" class="mb-6 p-4 bg-red-100 text-red-700 rounded-lg border border-red-200">
    {{ errorMessage }}
  </div>

  <form [formGroup]="aidForm" (ngSubmit)="onSubmit()" class="space-y-6">

    <div>
      <label for="category" class="block text-sm font-medium text-gray-700 mb-1">Type d'aide demandée *</label>
      <select id="category" formControlName="category"
              class="w-full px-4 py-2 border border-gray-300 rounded-lg focus:ring-2 focus:ring-blue-500 focus:border-blue-500 outline-none transition">
        <option value="" disabled selected>Choisir une catégorie...</option>
        <option *ngFor="let cat of categories" [value]="cat.value">{{ cat.label }}</option>
      </select>
      <p *ngIf="aidForm.get('category')?.touched && aidForm.get('category')?.invalid" class="mt-1 text-xs text-red-500">
        Veuillez choisir une catégorie.
      </p>
    </div>

    <div>
      <label for="amount" class="block text-sm font-medium text-gray-700 mb-1">Montant demandé (€) *</label>
      <input type="number" id="amount" formControlName="amount" placeholder="Ex: 450"
             class="w-full px-4 py-2 border border-gray-300 rounded-lg focus:ring-2 focus:ring-blue-500 focus:border-blue-500 outline-none transition" />
      <p *ngIf="aidForm.get('amount')?.touched && aidForm.get('amount')?.invalid" class="mt-1 text-xs text-red-500">
        Un montant valide (supérieur à 0) est obligatoire.
      </p>
    </div>

    <div>
      <label for="description" class="block text-sm font-medium text-gray-700 mb-1">Description et motivation du besoin *</label>
      <textarea id="description" formControlName="description" rows="5" placeholder="Expliquez en quelques lignes votre situation actuelle..."
                class="w-full px-4 py-2 border border-gray-300 rounded-lg focus:ring-2 focus:ring-blue-500 focus:border-blue-500 outline-none transition"></textarea>
      <p *ngIf="aidForm.get('description')?.touched && aidForm.get('description')?.invalid" class="mt-1 text-xs text-red-500">
        La description doit contenir au moins 10 caractères.
      </p>
    </div>

    <button type="submit" [disabled]="aidForm.invalid || isSubmitting"
            class="w-full bg-blue-600 text-white font-bold py-3 rounded-lg hover:bg-blue-700 transition duration-300 disabled:bg-gray-400 disabled:cursor-not-allowed">
      {{ isSubmitting ? 'Envoi en cours...' : 'Soumettre ma demande' }}
    </button>

  </form>
</div>
