<div class="admin-container p-6 bg-gray-50 min-h-screen">
  <h2 class="text-2xl font-bold text-gray-800 mb-6">Gestion des demandes d'aide</h2>

  <div class="overflow-hidden shadow-md sm:rounded-lg">
    <table class="w-full text-sm text-left text-gray-500">
      <thead class="text-xs text-gray-700 uppercase bg-gray-200">
        <tr>
          <th class="px-6 py-3">Bénéficiaire</th>
          <th class="px-6 py-3">Catégorie</th>
          <th class="px-6 py-3">Montant</th>
          <th class="px-6 py-3">Statut</th>
          <th class="px-6 py-3 text-center">Actions</th>
        </tr>
      </thead>
      <tbody>
        <tr *ngFor="let req of requests" class="bg-white border-b hover:bg-gray-100 transition-colors">
          <td class="px-6 py-4 font-medium text-gray-900">{{ req.beneficiaryId }}</td>
          <td class="px-6 py-4">{{ req.category }}</td>
          <td class="px-6 py-4">{{ req.amount }} €</td>
          <td class="px-6 py-4">
            <span class="px-2 py-1 rounded-full text-xs font-semibold"
                  [ngClass]="{'bg-green-100 text-green-800': req.status === 'APPROVED', 'bg-red-100 text-red-800': req.status === 'REJECTED', 'bg-yellow-100 text-yellow-800': req.status === 'PENDING'}">
              {{ req.status }}
            </span>
          </td>
          <td class="px-6 py-4 text-center flex justify-center gap-2">
            <button (click)="updateStatus(req.id, 'APPROVED')"
                    class="px-3 py-1 bg-green-600 text-white rounded hover:bg-green-700 transition">Valider</button>
            <button (click)="updateStatus(req.id, 'REJECTED')"
                    class="px-3 py-1 bg-red-600 text-white rounded hover:bg-red-700 transition">Refuser</button>
          </td>
        </tr>
      </tbody>
    </table>
  </div>
</div>
